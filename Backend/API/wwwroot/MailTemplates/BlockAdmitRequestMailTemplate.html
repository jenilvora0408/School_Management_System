<head>
  <title>School Portal</title>
  <style>
    body {
      font-family: Cambria, Cochin, Georgia, Times, "Times New Roman", serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 0;
      background-color: #f0f0f0;
    }
    .main-container {
      padding: 10px;
    }
    .container {
      margin: 0 auto;
      border-bottom: 5px solid #b77cee;
      box-shadow: 0px 1px 5px rgb(169, 169, 169);
      background-color: white;
      border-radius: 8px;
      width: 100%;
      max-width: 600px;
    }
    .header {
      text-align: center;
      padding: 20px 0;
      background-color: #b77cee;
      color: #ffffff;
      border-radius: 8px 8px 0 0;
    }
    .header h1 {
      color: #ffffff;
      margin: 0;
    }
    .content {
      padding: 20px;
      text-align: center;
      color: #333333;
    }
    .content p {
      margin: 0 0 20px;
    }
    .otp {
      font-size: 16px;
      font-weight: bold;
      color: #d96c4b;
      letter-spacing: 4px;
      margin: 20px 0;
    }
    .label {
      font-size: 18px;
    }
    .footer {
      text-align: center;
      font-size: 12px;
      color: #999999;
    }
    button {
      background-color: white;
      border: 0;
      cursor: pointer;
      padding: 0%;
    }
    img {
      height: 20px;
      width: 20px;
    }
    .content .warning {
      color: #d32f2f;
      font-size: 18px;
      font-weight: bold;
    }
    .content .note {
      font-size: 15px;
      color: #666;
    }
    .reason-block {
      background: #fbe9e7;
      border-left: 5px solid #d32f2f;
      padding: 10px;
      margin: 15px auto;
      border-radius: 5px;
      font-size: 16px;
      text-align: left;
      color: #333;
    }
  </style>
</head>
<div class="footer"></div>
<!DOCTYPE html>
<html>
  <body></body>
</html>
<div class="main-container">
  <div class="container">
    <div class="header">
      <h1>School Portal</h1>
    </div>
    <div class="content">
      <p>Hello, <b>{userName}</b></p>
      <p class="warning">Your Admit Request for the portal has been blocked!</p>
      <div class="reason-block">
        <strong>Reason for block:</strong> {reasonForBlock}
      </div>
      <p class="note">
        Unfortunately you cannot send another request to this portal!
      </p>
    </div>
  </div>
</div>
<p class="footer">&copy; 2024 School Management System.All rights reserved.</p>
