<div class="add-subject-to-class-container">
  <div
    class="modal-header mb-3 heading px-3 pt-3 pb-2 d-flex justify-content-between align-items-center"
  >
    <h4>Add Subject</h4>
    <button
      type="button"
      class="btn-close me-2"
      aria-label="Close"
      (click)="close()"
    ></button>
  </div>
  <div class="form-container modal-body mb-4">
    <form
      action=""
      class="d-flex flex-column"
      [formGroup]="addSubjectForm"
      (submit)="onSubmit()"
      appFormSubmit
    >
      <app-select
        [options]="subjectOptions"
        controlName="subjectName"
        [parentForm]="addSubjectForm"
        placeholder="Select a Type"
        className="form-control"
        [required]="true"
        label="Subject Name"
        errorTitle="Subject Name"
        class="w-100"
        (change)="onSubjectChange($event)"
      />
      @if(showError){
        <span class="error">Subject is already present!</span>
      }
      <div class="mb-3"></div>
      <div class="subject-code w-100 mb-3">
        <label for="subject-code">Subject Code</label>
        <input
          type="text"
          class="form-control w-100"
          disabled
          placeholder="Subject Code"
          [value]="selectedSubjectCode"
        />
      </div>
      <div class="subject-teacher-name w-100 mb-3">
        <label for="subject-teacher-name">Subject Teacher</label>
        <input
          type="text"
          class="form-control w-100"
          disabled
          placeholder="Evan Donohue"
          [value]="selectedSubjectTeacher"
        />
      </div>
    </form>
  </div>
  <div class="modal-footer">
    <div class="buttons mt-1 d-flex gap-4">
      <app-button
        type="submit"
        label="Submit"
        (btnClick)="onSubmit()"
        className="btn text-btn"
      ></app-button>

      <app-button
        type="button"
        label="Cancel"
        className="btn close-btn"
        (btnClick)="close()"
      ></app-button>
    </div>
  </div>
</div>
