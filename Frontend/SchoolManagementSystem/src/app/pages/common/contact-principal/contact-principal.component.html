<div class="container-fluid p-0">
  <div class="header">
    <app-header></app-header>
  </div>
  <div class="content-container px-5 py-4 d-flex justify-content-center">
    <div class="w-50">
      <h3>Contact Principal</h3>
      <span
        >Need any help? Do not hesitate to reach out. We care about you, about
        the country's fututre!</span
      >
      <div class="mt-3 form-container border border-2 p-3">
        <form
          [formGroup]="contactPrincipalForm"
          appFormSubmit
          class="px-3 pt-2 d-flex flex-column gap-3"
        >
          <app-input
            title="Subject"
            type="text"
            label="Subject"
            className="inputField py-3 fs-6 form-control apply-border"
            placeholder="Subject..."
            [parentForm]="contactPrincipalForm"
            controlName="subject"
            errorTitle="Subject"
            [required]="true"
          ></app-input>
          <app-select
            [options]="requestRoleOptions"
            controlName="typeOfRequest"
            [required]="true"
            [parentForm]="contactPrincipalForm"
            placeholder="Select a Type"
            className="py-2 form-control"
            label="Select Request Type"
            errorTitle="Request Type"
          />
          <app-textarea
            label="Description"
            controlName="description"
            [required]="true"
            [parentForm]="contactPrincipalForm"
            className="app-textarea form-control"
            errorTitle="Description"
            placeholder=""
          />
          <div class="avatar-container">
            <label for="relatableEvidence">Upload Evidence</label>
            <input
              type="file"
              (change)="handlePictureFileChange($event)"
              #photoInput
              id="photoInput"
              accept="image/*"
              class="form-control"
              formControlName="relatableEvidence"
            />
          </div>
          <div class="buttons d-flex justify-content-center gap-3 pe-4">
            <app-button
              label="Submit"
              title="Submit"
              (btnClick)="onSubmit()"
              type="submit"
              className="mt-3 px-3 text-btn"
            >
            </app-button>
            <app-button
              label="Cancel"
              title="cancel"
              (btnClick)="cancelForm()"
              type="button"
              className="mt-3 px-3 close-btn"
            >
            </app-button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
