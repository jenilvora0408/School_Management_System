<div class="container-fluid p-0">
  <div class="header">
    <app-header></app-header>
  </div>
  <div class="bg-light m-5 p-5">
    <div>
      <div class="heading mb-5">
        <h3>Contact Requests</h3>
      </div>
    </div>
    <div
      class="class-boxes d-flex flex-wrap gap-4 align-items-center justify-content-center pb-4"
    >
      @for (item of responseData; track i; let i = $index){
      <div class="box px-3 py-2">
        <div class="d-flex align-items-center justify-content-between">
          <p class="sub-heading fs-4">{{ item.subject }}</p>
          <div>
            <i
              class="bi bi-arrow-right-circle fs-4"
              (click)="navigateToMyRequest(item.contactPrincipalId)"
            ></i>
          </div>
        </div>
        <div class="d-flex align-items-center justify-content-between">
          <span
            >Requested Date:
            <span class="result">
              {{ item.requestDate | dateFormat }}
            </span></span
          >
        </div>
      </div>
      }
    </div>
  </div>
</div>
