<div class="container-fluid p-0">
  <div class="header">
    <app-header></app-header>
  </div>
  <div class="user-request-info px-5 mt-3 d-flex justify-content-center">
    <div class="form-content w-50 ps-5 ms-5">
      <h3>Contact Request</h3>
      <div class="username">
        <label for="name">Username</label>
        <input
          type="text"
          class="form-control w-75 bg-light"
          disabled
          value="{{ username }}"
        />
      </div>
      <div class="subject mt-3">
        <label for="subject">Subject</label>
        <input
          type="text"
          class="form-control w-75 bg-light"
          disabled
          value="{{ subject }}"
        />
      </div>
      <div class="type-of-request mt-3">
        <label for="type-of-request">Request Type</label>
        <input
          type="text"
          class="form-control w-75 bg-light"
          disabled
          value="{{ requestType }}"
        />
      </div>
      <div class="description mt-3">
        <label for="description">Description</label>
        <textarea name="address" class="form-control w-75 bg-light" disabled>{{
          description
        }}</textarea>
      </div>
      <label for="documents" class="mt-3 ms-1">Documents</label>
      <div class="documents d-flex flex-wrap">
        @for (image of requestDocuments; track i; let i = $index){
        <div class="image-preview">
          <img [src]="image" alt="Uploaded Image" />
          <div class="download-icon" class="download-btn" (click)="downloadImage(image, i)">
            <i class="bi bi-arrow-down-circle-fill"></i>
          </div>
        </div>
        }
      </div>
    </div>
  </div>
</div>
