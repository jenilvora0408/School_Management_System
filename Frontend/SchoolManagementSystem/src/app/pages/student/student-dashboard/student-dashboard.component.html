<div class="student-dashboard-container container-fluid p-0">
  <app-header></app-header>
  <div class="admit-request-list-container p-5 pb-0">
    <div class="main-heading">
      <h3 class="text-center">{{ className }}</h3>
    </div>
    <h4 class="dashboard-heading fw-normal">Subjects</h4>
    <div class="d-flex gap-4">
      <input
        type="text"
        class="form-control mb-4 w-25 bg-light p-2"
        placeholder="Search..."
        #searchInput
        (keyup)="search(searchInput.value)"
      />
    </div>
    @if(responseData.length > 0){
    <table class="table table-striped table-hover border border-1">
      <thead>
        <tr class="table-primary">
          <th scope="col">Serial</th>
          <th scope="col">Subject</th>
          <th scope="col">Subject Code</th>
          <th scope="col">Subject Teacher</th>
          <th scope="col">Actions</th>
        </tr>
      </thead>
      <tbody>
        @for (item of responseData; track i; let i = $index){
        <tr class="border border-2">
          <td>{{ i + 1 }}</td>
          <td>{{ item.subjectName }}</td>
          <td>
            {{ item.subjectCode }}
          </td>
          <td>{{ item.subjectTeacherName }}</td>
          <td>
            <span class="ms-4"></span
            ><i
            (click)="viewChapters(item.classId, item.subjectId, item.className, item.subjectName)"
              class="bi bi-info-circle fs-5"
              placement="top"
              ngbTooltip="View chapters of {{item.subjectName}}"
            ></i>
          </td>
        </tr>
        }
      </tbody>
    </table>
    <div class="d-flex justify-content-between p-2">
      <ngb-pagination
        [collectionSize]="collectionSize"
        [(page)]="page"
        [pageSize]="pageSize"
        (pageChange)="getSubjectsData()"
      >
      </ngb-pagination>

      <select
        class="form-select"
        style="width: auto"
        [(ngModel)]="pageSize"
        (ngModelChange)="getSubjectsData()"
      >
        <option [ngValue]="3">3 items per page</option>
        <option [ngValue]="5">5 items per page</option>
        <option [ngValue]="8">8 items per page</option>
        <option [ngValue]="10">10 items per page</option>
      </select>
    </div>
    } @else {
    <h3 class="text-center">No Subjects Found!</h3>
    }
  </div>
</div>
